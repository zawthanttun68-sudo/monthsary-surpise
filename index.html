<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Monthsary ❤️ | For Ivy</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Night Sky Background -->
    <div class="background">
        <div class="moon"></div>

         <div class="cloud cloud1"></div>
         <div class="cloud cloud2"></div>
         <div class="cloud cloud3"></div>

        <div id="stars"></div>
    </div>

    <!-- Floating Hearts -->
    <div id="hearts"></div>

    <!-- Background Music -->
    <audio id="bgMusic" loop>
        <source src="music/iwannabeyours.mp3" type="audio/mpeg">
    </audio>

    <!-- ========================= -->
    <!-- Welcome Page -->
    <!-- ========================= -->

    <section id="welcomePage" class="page">

        <div class="glass">

            <h3>❤️ Happy Monthsary ❤️</h3>

            <h1>Dear Ivy</h1>

            <p>
                I made something special just for you.
                <br><br>
                Please click the button below...
            </p>

            <button id="startBtn">
                Open My Heart ❤️
            </button>

        </div>

    </section>

    <!-- ========================= -->
    <!-- Love Letter -->
    <!-- ========================= -->

    <section id="letterPage" class="page hidden">

        <div class="glass letterBox">

            <p id="typing"></p>

        </div>

    </section>

    <!-- ========================= -->
    <!-- Gallery -->
    <!-- ========================= -->

    <section id="galleryPage" class="page hidden">

    <img
        id="galleryImage"
        src="images/photo1.jpg"
        alt="Our Memory">

</section>

    <!-- ========================= -->
    <!-- Ending -->
    <!-- ========================= -->

    <section id="endingPage" class="page hidden">

        <div class="glass">

            <h1>❤️ Happy Monthsary ❤️</h1>

            <h2>Forever & Always</h2>

            <p>

                No matter where life takes us...

                <br><br>

                I'll always choose you.

            </p>

            <div class="signature">

                <p>Made with ❤️</p>

                <p>Especially for Ivy</p>

                <br>

                <h3>By</h3>

                <h2>Kham</h2>

            </div>

        </div>

    </section>

    <!-- Love Counter -->

    <div id="counter">

        ❤️ Together Since ❤️

        <br>

        <span id="time"></span>

    </div>

    <script src="script.js"></script>

</body>
</html>
